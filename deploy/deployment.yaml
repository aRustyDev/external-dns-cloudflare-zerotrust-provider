# ExternalDNS running the Cloudflare Zero Trust webhook provider as a sidecar.
#
# Provide the Cloudflare credentials out-of-band (do NOT commit a real token):
#   kubectl -n external-dns create secret generic cf-zerotrust \
#     --from-literal=CF_API_TOKEN=<scoped-token> \
#     --from-literal=CF_ACCOUNT_ID=<account-id> \
#     --from-literal=CF_TUNNEL_ID=<tunnel-id>
#
# The scoped API token needs: Account > Cloudflare One Networks : Edit.
# (Cloudflare Tunnel : Edit alone is NOT sufficient — route creation returns 403 error 10000.)
#
# ⚠️  ExternalDNS's --dry-run DOES NOT PROTECT A WEBHOOK PROVIDER. It logs "No changes to DNS
#     records will be made." and then makes them: cfg.DryRun is never passed to the webhook
#     provider (see docs/upstream-dry-run-gap.md). To rehearse safely against a live Cloudflare
#     account, set DRY_RUN=true on the webhook container below — NOT --dry-run here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
---
# Leg 2 (optional, enabled by COREDNS_CONFIGMAP): permission to write ONE key of ONE ConfigMap.
# Scoped with resourceNames so this cannot touch the base Corefile ConfigMap or any other. `patch`
# is what server-side apply needs; `get` is the read half of the read-modify-write. NOT `update`,
# and no `create` — the fragment ConfigMap is expected to already exist, owned by whoever manages
# the cluster's CoreDNS.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns-coredns-fragment
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["coredns-fragments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns-coredns-fragment
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns-coredns-fragment
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
      annotations:
        # The webhook provider exposes Prometheus metrics on the health port at /metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
      containers:
        # --- ExternalDNS core: talks to our webhook over localhost ---
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --source=service
            - --provider=webhook
            - --webhook-provider-url=http://localhost:8888
            # ZT hostname routes cannot store TXT ownership records -> no-op registry.
            - --registry=noop
            # upsert-only never deletes routes: safe default for validating against a live
            # tunnel. Switch to --policy=sync to enable route DELETES on Service removal
            # once you have validated the round-trip (ideally paired with ownership-strict
            # mode so deletes are confined to routes this instance owns).
            - --policy=upsert-only
            - --domain-filter=private
            # REQUIRED for ClusterIP Services (which example-service.yaml is, and which most
            # `.private` names front). Without it ExternalDNS silently skips them — no route,
            # no error.
            - --publish-internal-services
            - --interval=1m
            - --log-level=info
            # NOTE: do NOT add --dry-run expecting it to protect anything. It is silently inert
            # for webhook providers; set DRY_RUN=true on the webhook container instead.
          ports:
            - name: http
              containerPort: 7979
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # --- Cloudflare Zero Trust webhook provider (this project) ---
        - name: webhook
          # Pin to a released tag. This manifest targets v0.3.0 (create/list/delete round-trip
          # verified against the live Cloudflare API); the image exists once the v0.3.0 git tag
          # is cut.
          image: ghcr.io/arustydev/external-dns-cloudflare-zerotrust-provider:0.3.0
          env:
            - name: DOMAIN_FILTER
              value: "private"
            # OWNER_ID tags every route this instance creates
            # (comment "managed-by=external-dns/<OWNER_ID>").
            - name: OWNER_ID
              value: "cluster-a"
            # Ownership-strict: only ever read back / delete routes carrying this OWNER_ID,
            # so Terraform-owned or hand-created routes are never disturbed. Strongly
            # recommended; set "false" only to deliberately adopt pre-existing routes.
            - name: OWNERSHIP_STRICT
              value: "true"
            # DRY_RUN=true logs every intended route create/delete and makes NO mutating
            # Cloudflare call — the only working dry run for a webhook provider. Read-only list
            # calls still happen, so the logged plan is a real diff against live state.
            # Alert on cfzt_provider_dry_run == 1 so an instance is never left inert unnoticed.
            - name: DRY_RUN
              value: "false"
            # ADOPT_UNTAGGED=true lets a create for a hostname that ALREADY has a Cloudflare
            # route claim that route instead of failing, by rewriting its comment to this
            # OWNER_ID. The route id and tunnel binding are untouched, so the name never stops
            # resolving — this is what makes a Terraform -> annotations migration zero-downtime
            # (Cloudflare otherwise rejects the duplicate create with 409 / error 1108).
            # ⚠️  It TAKES OWNERSHIP of routes this provider did not create. Enable it
            #     deliberately for a migration, ideally with DRY_RUN=true first.
            - name: ADOPT_UNTAGGED
              value: "false"
            # --- Leg 2: the in-cluster CoreDNS answer (optional) ---
            # Unset, this provider manages ONLY the Cloudflare route, and a name will NOT resolve
            # until something else supplies the CoreDNS answer. Set COREDNS_CONFIGMAP to
            # <namespace>/<name> and this instance also owns one key of that ConfigMap, so a single
            # Service annotation drives BOTH legs.
            #
            # Requires: the cluster's CoreDNS Corefile must `import` the fragment directory (e.g.
            # `import /etc/coredns-custom/*.override`) with that ConfigMap mounted there, and the
            # RBAC Role above. The provider writes ONLY its own key under its own field manager, so
            # it can never disturb another owner's key or the base Corefile.
            # - name: COREDNS_CONFIGMAP
            #   value: "kube-system/coredns-fragments"
            # - name: COREDNS_FRAGMENT_KEY      # default zz-external-dns.override
            #   value: "zz-external-dns.override"
            # - name: COREDNS_FIELD_MANAGER     # default external-dns; MUST be unique to this writer
            #   value: "external-dns"
            # - name: CLUSTER_DOMAIN            # default cluster.local
            #   value: "cluster.local"
            # Single tunnel via CF_TUNNEL_ID (from the secret below). For multiple tunnels,
            # drop CF_TUNNEL_ID and set TUNNEL_MAP instead (most-specific domain wins):
            #   - name: TUNNEL_MAP
            #     value: "apps.private=<tunnel-a>,private=<tunnel-b>"
            - name: WEBHOOK_LISTEN
              value: "127.0.0.1:8888"
            - name: HEALTH_LISTEN
              value: "0.0.0.0:8080"
          envFrom:
            - secretRef:
                name: cf-zerotrust
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
