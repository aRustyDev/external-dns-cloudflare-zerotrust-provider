# ExternalDNS running the Cloudflare Zero Trust webhook provider as a sidecar.
#
# Provide the Cloudflare credentials out-of-band (do NOT commit a real token):
#   kubectl -n external-dns create secret generic cf-zerotrust \
#     --from-literal=CF_API_TOKEN=<scoped-token> \
#     --from-literal=CF_ACCOUNT_ID=<account-id> \
#     --from-literal=CF_TUNNEL_ID=<tunnel-id>
#
# The scoped API token needs: Account > Cloudflare Tunnel : Edit (Zero Trust routes).
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
      annotations:
        # The webhook provider exposes Prometheus metrics on the health port at /metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
      containers:
        # --- ExternalDNS core: talks to our webhook over localhost ---
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --source=service
            - --provider=webhook
            - --webhook-provider-url=http://localhost:8888
            # ZT hostname routes cannot store TXT ownership records -> no-op registry.
            - --registry=noop
            # upsert-only never deletes routes: safe default for validating against a live
            # tunnel. Switch to --policy=sync to enable route DELETES on Service removal
            # once you have validated the round-trip (ideally paired with ownership-strict
            # mode so deletes are confined to routes this instance owns).
            - --policy=upsert-only
            - --domain-filter=woven
            - --interval=1m
            - --log-level=info
          ports:
            - name: http
              containerPort: 7979
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # --- Cloudflare Zero Trust webhook provider (this project) ---
        - name: webhook
          # Pin to a released tag. This manifest targets v0.2.0 (ownership-strict, metrics,
          # multi-tunnel); the image exists once the v0.2.0 git tag is cut.
          image: ghcr.io/arustydev/external-dns-cloudflare-zerotrust-provider:0.2.0
          env:
            - name: DOMAIN_FILTER
              value: "woven"
            # OWNER_ID tags every route this instance creates
            # (comment "managed-by=external-dns/<OWNER_ID>").
            - name: OWNER_ID
              value: "woven-o11y"
            # Ownership-strict: only ever read back / delete routes carrying this OWNER_ID,
            # so Terraform-owned or hand-created routes are never disturbed. Strongly
            # recommended; set "false" only to deliberately adopt pre-existing routes.
            - name: OWNERSHIP_STRICT
              value: "true"
            # Single tunnel via CF_TUNNEL_ID (from the secret below). For multiple tunnels,
            # drop CF_TUNNEL_ID and set TUNNEL_MAP instead (most-specific domain wins):
            #   - name: TUNNEL_MAP
            #     value: "apps.woven=<tunnel-a>,woven=<tunnel-b>"
            - name: WEBHOOK_LISTEN
              value: "127.0.0.1:8888"
            - name: HEALTH_LISTEN
              value: "0.0.0.0:8080"
          envFrom:
            - secretRef:
                name: cf-zerotrust
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
