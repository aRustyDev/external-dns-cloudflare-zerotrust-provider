# Container build/push + release. Multi-arch image to GHCR with metadata-action semver
# tagging, cosign keyless signing, SLSA provenance + SBOM attestations, a Trivy image-scan
# gate before signing, and a source SBOM attached to the GitHub release on v* tags.
#
# This workflow PUBLISHES, so it runs only after a merge to main or on a version tag, never on a
# pull request. A pull request gets a Dockerfile lint and a no-push build of the same Dockerfile
# from the `docker` job in ci.yaml instead.
name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write # push to ghcr
  id-token: write # keyless cosign signing

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    # With QEMU gone the multi-arch build is expected to take a few minutes, down from ~18. The
    # limit stays generous until a run on main confirms that, and keeps a wedged build from
    # burning the 6-hour default.
    timeout-minutes: 40
    outputs:
      image: ${{ steps.imagename.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # audit (not block): a multi-arch buildx build pulls from many hosts, and a blocking
      # egress policy here would need an allowlist re-tuned on every base-image bump.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A v* tag can be pushed on any commit, and this workflow publishes and signs an image, while a
      # merge to main is the only approval this repository has. So refuse a tag whose commit is not
      # already on main. "identical" is main's tip and "behind" is an earlier commit of main; anything
      # else, or a failed lookup, stops the job before anything below can publish.
      - name: Require the tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "$status" in
            identical|behind)
              echo "${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is on main (${status})"
              ;;
            *)
              echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main (compare status: '${status}')"
              exit 1
              ;;
          esac

      # ghcr image refs must be lowercase; the owner (aRustyDev) is mixed-case.
      - name: Compute image name
        id: imagename
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # No QEMU: the Dockerfile cross-compiles on the builder's architecture, so no RUN executes
      # under a foreign platform. The docker job in ci.yaml builds both platforms without it too.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Publish gate: scan the pushed image for fixable HIGH/CRITICAL OS-package vulns
      # before we sign it. Go dependency vulns are gated separately by govulncheck in ci.yaml
      # (reachability-aware), so this focuses on the base image and avoids double-jeopardy on
      # unreachable library CVEs.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os
          severity: HIGH,CRITICAL

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Attach a source (Go module) SBOM to the release as a downloadable asset, in
      # addition to the SBOM attestation buildx already attaches to the image.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: sbom.spdx.json
