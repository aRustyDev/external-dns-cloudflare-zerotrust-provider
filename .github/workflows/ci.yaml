name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so govulncheck re-scans pinned deps against newly-disclosed CVEs
    # even without a code change.
    - cron: '17 4 * * 1'

# Cancel superseded runs on the same ref (pattern borrowed from the plane fork's
# PR workflows) so a new push doesn't queue behind stale CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; jobs re-declare what they need.
permissions:
  contents: read

jobs:
  build-test:
    # Matrix over both arches the release image actually ships (linux/amd64 + linux/arm64),
    # on NATIVE runners — free for public repos. Cross-compiling arm64 would type-check it
    # but never execute it, so -race and the concurrency-sensitive tests would only ever be
    # proven on amd64. fail-fast:false so an arch-specific failure cannot mask the other arch.
    name: build-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      # harden-runner's monitor is x86-only; skip it on the arm64 leg rather than fail there.
      - name: Harden runner
        if: runner.arch == 'X64'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # -covermode=atomic is required alongside -race. The `integration` build tag is absent,
      # so the live Cloudflare tests stay excluded here by design.
      - name: test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  broker:
    # The route broker (broker/) is TypeScript run by Node, and the Go end-to-end test in
    # test/broker drives the real Go client and provider against it. Neither runs in build-test,
    # where the runner's Node is too old to execute TypeScript directly and the end-to-end test
    # skips, so this job is where that coverage actually happens.
    name: broker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true
      # Node 24 runs TypeScript directly, so the Worker's tests need no build step and no npm
      # dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: broker unit tests
        run: node --test broker/test/*.test.ts
      # The only npm package fetched, and only to typecheck; pinned to the version it was verified with.
      - name: broker typecheck
        run: npx --yes -p typescript@5.9.3 tsc -p broker
      - name: broker end-to-end (Go client and provider against the real broker)
        run: go test -race -count=1 -v ./test/broker/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # govulncheck scans against this toolchain's standard library. Without this the runner
          # image's cached 1.27.x is used even after a fixed patch release exists.
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A pull request never publishes (see release.yml). This is the part of the image pipeline that is
  # safe to run on one: lint the Dockerfile with BuildKit's own checks, then build it without pushing,
  # so a broken Dockerfile fails here rather than after the merge. Both platforms are built: the
  # Dockerfile cross-compiles on the builder's own architecture, so arm64 needs no QEMU. That is also
  # why this job sets none up, so it would fail here if a RUN ever needed emulation again. The cache
  # is only read, never written: a build takes about a minute, and writing it from a PR costs more than
  # it saves. Nothing here logs in to a registry or signs.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Lint Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          call: check
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
